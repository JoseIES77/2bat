site_name: "1. Fonaments bàsics de la programació"
nav: 
      - Inici: index.md
      - "Introducció a la programació": "1_IntroPRG.md"
      - "Introducció a Python": "2_Introduccio_Python.md"
      - "Preparant l'entorn": "3_Preparant_entorn.md"
      - "Hello World!": "4_HelloWorld.md"
      - "Estructura d'un programa en Python": "5_Estructura_programa.md"
      - "Operadors y Expressions": "6_OperadorsExpresions.md"
      - "Números i Text": "7_Numeros_Cadenes.md"
      - "Entrada i Eixida Estàndar": "8_InputOutput.md"
      - "Llistes": "9_Llistes.md"
      - "Funcions": "10_Funcions.md"
      - "Pràctica Final UD1": "11_PracticaFinal.md"
      - "GitHub" : "12_ExtraGithub.md"


theme:
  name: 'material'
  custom_dir: 'overrides'
  logo: 'img/logo.png'
  favicon: 'img/logo.png'
  features:
    - content.code.copy # PEr copiar codi
  palette:
    accent: deep purple
    primary: amber

extra_css:
  - https://joamuran.net/curs24_25/css/material-just.css

plugins:
  - search
  #- glightbox # Per vore les imatges en gran quan fas clic en elles.
# - pandoc

markdown_extensions:
  - attr_list         # Permet incorporar atributs a les imatges { width=100px }
  - md_in_html # Junt a attr_list per afegir peus a les imatges
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      baselevel: 2
      toc_depth: 3