site_name: "2. Estructures de control i depuració"
nav: 
      - Inici: index.md
      - "Introducció": "1.IntroControlDepu.md"
      - "Estructures de Selecció": "2.EstructuresSeleccio.md"
      - "Estructures de Repetició": "3.EstructuresRepeticio.md"
      - "Estructures de Salt": "4.EstructuresSalt.md"
      - "Excepcions": "5.Excepcions.md"
      - "Assercions": "6.Asercions.md"
      - "Depuració i Documentació": "7.DepuracioDocumentacio.md"
      #- "Activitats": "8.ActivitatsFinals.md"
      #- "Projecte IPRG": "9.Projecte_Part1.md"
      #- "Projecte IPRG Solució": "10.Projecte_Solucio.md"
  

theme:
  name: 'material'
  custom_dir: 'overrides'
  logo: '../img/logo.png'
  favicon: '../img/logo.png'
  features:
    - content.code.copy # PEr copiar codi
  palette:
    accent: deep purple
    primary: amber

extra_css:
  - https://joamuran.net/curs24_25/css/material-just.css

plugins:
  - search
  #- glightbox # Per vore les imatges en gran quan fas clic en elles.
# - pandoc

markdown_extensions:
  - attr_list         # Permet incorporar atributs a les imatges { width=100px }
  - md_in_html # Junt a attr_list per afegir peus a les imatges
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      baselevel: 2
      toc_depth: 3