site_name: "4. Matrius, Operacions Agregades i Expressions Regulars"
nav: 
      - Inici: index.md
      - Introduccio: 1.Introduccio.md
      - Matrius (Arrays) i Matrius Multidimensionals: 2.Matrius.md
      - Manipulació de Cadenes de Text i Expressions Regulars: 3.Cadenes_ER.md
      - Operacions Agregades. Filtració, Reducció i Recol·lecció: 4.Agregades.md
      - Tractament de Documents i Intercanvi de Dades: 5.Documents.md

theme:
  name: 'material'
  custom_dir: 'overrides'
  logo: '../img/logo.png'
  favicon: '../img/logo.png'
  features:
    - content.code.copy # PEr copiar codi
  palette:
    accent: deep purple
    primary: amber

extra_css:
  - https://joamuran.net/curs24_25/css/material-just.css

plugins:
  - search
  #- glightbox # Per vore les imatges en gran quan fas clic en elles.
# - pandoc

markdown_extensions:
  - attr_list         # Permet incorporar atributs a les imatges { width=100px }
  - md_in_html # Junt a attr_list per afegir peus a les imatges
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      baselevel: 2
      toc_depth: 3